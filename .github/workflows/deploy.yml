name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VENICE_API_KEY: ${{ secrets.VITE_VENICE_API_KEY }}
          VITE_DEV_EMAIL: ${{ secrets.VITE_DEV_EMAIL }}
          VITE_MAX_PRAYER_CHARS: ${{ secrets.VITE_MAX_PRAYER_CHARS }}
          VITE_DAILY_TOKEN_LIMIT: ${{ secrets.VITE_DAILY_TOKEN_LIMIT }}
          VITE_PRAYER_TOKEN_RATIO: ${{ secrets.VITE_PRAYER_TOKEN_RATIO }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
